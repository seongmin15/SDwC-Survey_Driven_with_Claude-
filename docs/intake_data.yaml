# ──────────────────────────────────────
# SDwC — Intake Data
# ──────────────────────────────────────
schema_version: '2026-02-11'

# ═══════════════════════════════════
# project_basics (order: 1)
# ═══════════════════════════════════
project:
  name: sdwc
  description: |
    설문만 작성하면 AI 협업에 최적화된 프로젝트 문서 패키지(CLAUDE.md, docs/, .sdwc/)를
    자동 생성하여 ZIP으로 제공하고, Claude Code가 이를 기반으로 프로젝트를 초기화하는 서비스.
    설문 → 문서 패키지 ZIP 생성 → Claude Code에서 프로젝트 시작.
  target_users: |
    Claude와 함께 소프트웨어를 개발하려는 1인 개발자.
  core_value: |
    설문만 작성하면 AI 협업에 최적화된 프로젝트 문서를 즉시 받을 수 있다.

# ═══════════════════════════════════
# mvp_scope (order: 2)
# ═══════════════════════════════════
scope:
  in_scope:
    - "설문 입력 (intake_schema.yaml 기반 동적 폼)"
    - "intake 데이터 + doc-templates 매칭 → 문서 자동 생성 (Template Engine)"
    - "생성된 문서 ZIP 패키징 및 다운로드"
    - "프로젝트 URL 발급"
    - "REST API (설문 저장, 생성 트리거, 프로젝트 조회, ZIP 다운로드)"
    - "Web UI (설문 페이지, 생성 페이지, 완료 페이지)"
    - "Docker Compose 로컬 개발 환경"
    - "TDD 기반 개발"
  out_of_scope: |
    - 팀 협업 기능
    - 사용자 인증
    - Notion 연동
    - CLI (sdwc clone / sdwc start) — MVP 이후
    - CI/CD 파이프라인 — MVP 이후
    - 클라우드 배포 — MVP 이후
  success_criteria: |
    설문 작성 → 문서 생성 → ZIP 다운로드 → Claude Code에서 "프로젝트 시작해" →
    Claude가 docs/ 읽고 skills/ 생성하여 프로젝트 초기화 완료.

# ═══════════════════════════════════
# architecture (order: 3)
# ═══════════════════════════════════
architecture:
  pattern: monolith
  pattern_reason: |
    서비스가 2개(backend_api, web_ui)뿐이고 MVP 단계라 단일 배포가 효율적.
  internal_style: hexagonal
  internal_style_reason: |
    도메인 로직을 프레임워크와 분리하여 테스트성을 높이고 기술 교체에 유리하게 하기 위해.

# ═══════════════════════════════════
# service_select (order: 4, condition: pattern != microservice)
# ═══════════════════════════════════
services:
  - backend_api
  - web_ui

# ═══════════════════════════════════
# backend_config (order: 10, condition: services contains backend_api)
# ═══════════════════════════════════
backend:
  language: python
  framework: fastapi
  framework_reason: |
    비동기 지원이 좋고 Python 생태계를 활용할 수 있어서.
  build_tool: poetry
  build_tool_reason: |
    의존성 잠금과 가상환경 관리가 일원화되어 있어서.
  databases:
    - engine: postgresql
      role: primary
      reason: |
        JSONB 지원으로 설문 데이터를 유연하게 저장 가능. 안정성, 확장성.
  api_style: rest
  auth: none
  deploy_target: docker
  main_endpoints: |
    POST /intakes — 설문 데이터 저장
    POST /generate — 문서 생성 트리거
    GET /projects/:id — 프로젝트 메타 조회
    GET /projects/:id/download — ZIP 다운로드
  main_entities: |
    projects — 프로젝트 (설문 데이터 + 생성 상태)
    events — 생성 이벤트 이력

# ═══════════════════════════════════
# web_config (order: 20, condition: services contains web_ui)
# ═══════════════════════════════════
web:
  language: typescript
  framework: react
  framework_reason: |
    생태계가 풍부하고 동적 폼 구현에 적합.
  css_strategy: tailwind
  build_tool: pnpm
  build_tool_reason: |
    디스크 효율과 설치 속도가 빠름.
  main_pages: |
    Survey — 설문 입력 페이지
    Generate — 문서 생성 페이지
    Complete — 프로젝트 URL 안내 페이지
  page_flow: |
    Survey → Generate → Complete (URL 복사)
  deploy_target: same_server
  connected_api: backend_api

# ═══════════════════════════════════
# collaboration (order: 80)
# ═══════════════════════════════════
collaboration:
  methodology: kanban
  # sprint_length: (조건 미충족 — methodology != scrum)
  task_review_minutes: 30
  wip_limit: 2
  use_subagent: false
  model_routing: opus_sonnet
  tdd: true

# ═══════════════════════════════════
# git (order: 81)
# ═══════════════════════════════════
git:
  branch_strategy: master_develop_task
  pr_by: user

# ═══════════════════════════════════
# deployment (order: 82)
# ═══════════════════════════════════
deployment:
  initial: docker_compose
  initial_reason: |
    초기에는 단일 서버로 충분하고 설정이 간단해서.
  # future: (선택하지 않음)

# ═══════════════════════════════════
# observability (order: 83)
# ═══════════════════════════════════
observability:
  included_in_mvp: false
  # logging, metrics, tracing: (조건 미충족 — included_in_mvp == false)

# ═══════════════════════════════════
# extensions (order: 90)
# ═══════════════════════════════════
extensions:
  notion_enabled: false
  future_plans: |
    - CLI 도구 (sdwc clone / sdwc start)
    - 팀 협업 기능
    - 사용자 인증
    - Notion 연동
    - 클라우드 배포
    - CI/CD 파이프라인
    - 외부 분석 엔진 연동
    - 문서 자동 생성 플러그인
